openapi: 3.0.3
info:
  title: go-payments-core
  version: 1.0.0
  description: |
    Núcleo transaccional de una pasarela de pagos. Maneja el ciclo de vida de un
    cobro (autorización, captura, reembolso, anulación) con idempotencia extremo
    a extremo, ledger de doble partida y aislamiento multitenant.
servers:
  - url: http://localhost:8080
    description: Entorno local
tags:
  - name: Payment Intents
    description: Ciclo de vida de un intento de pago
  - name: Operaciones
    description: Health y documentación
components:
  parameters:
    MerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      schema: { type: string }
      description: Identificador del comercio. Base del aislamiento multitenant.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        Clave única de la operación. Un reintento con la misma clave y el mismo
        cuerpo devuelve la respuesta original sin repetir el efecto.
    IntentId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Money:
      type: object
      properties:
        amount: { type: integer, format: int64, description: Importe en la unidad mínima (centavos) }
        currency: { type: string, example: BOB, description: Moneda ISO 4217 }
    PaymentIntent:
      type: object
      properties:
        id: { type: string, example: pi_7f3a }
        merchant_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        captured: { $ref: '#/components/schemas/Money' }
        refunded: { $ref: '#/components/schemas/Money' }
        status:
          type: string
          enum: [created, authorized, captured, refunded, voided, failed]
        method:
          type: object
          properties:
            type: { type: string, enum: [card, bank_transfer, cash, qr] }
            token: { type: string, description: Referencia opaca; nunca un PAN }
        provider_ref: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        transaction_id: { type: string }
        account: { type: string }
        direction: { type: string, enum: [debit, credit] }
        amount: { $ref: '#/components/schemas/Money' }
    Problem:
      type: object
      description: Error en formato RFC 7807
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, example: invalid_state_transition }
  responses:
    Problem:
      description: Error de negocio o de validación
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
paths:
  /v1/payment-intents:
    post:
      tags: [Payment Intents]
      summary: Crea un intento de pago
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, method]
              properties:
                amount: { type: integer, format: int64, example: 15000 }
                currency: { type: string, example: BOB }
                method: { type: string, enum: [card, bank_transfer, cash, qr] }
                token: { type: string, example: tok_9d2c }
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: Intento creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}:
    get:
      tags: [Payment Intents]
      summary: Consulta un intento de pago
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Intento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}/authorize:
    post:
      tags: [Payment Intents]
      summary: Autoriza el intento contra el procesador
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '402': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}/capture:
    post:
      tags: [Payment Intents]
      summary: Captura total o parcial
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IntentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, format: int64, description: Omitir para capturar el total }
      responses:
        '200':
          description: Capturado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}/refund:
    post:
      tags: [Payment Intents]
      summary: Reembolsa total o parcial
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IntentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, format: int64 }
      responses:
        '200':
          description: Reembolsado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}/void:
    post:
      tags: [Payment Intents]
      summary: Anula una autorización no capturada
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Anulado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/payment-intents/{id}/ledger:
    get:
      tags: [Payment Intents]
      summary: Asientos contables del intento
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Asientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
  /healthz:
    get:
      tags: [Operaciones]
      summary: Liveness
      responses:
        '200': { description: Servicio vivo }
  /readyz:
    get:
      tags: [Operaciones]
      summary: Readiness
      responses:
        '200': { description: Servicio listo }
