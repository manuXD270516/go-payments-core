services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments_core
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_ENV: docker
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments_core?sslmode=disable
      LOG_LEVEL: info
    ports: ["8080:8080"]

volumes:
  pgdata:
